<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider Image</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slide-container">
        <div class="slide">
            <img src="img/th1.jpeg" alt="">
            <div class="caption">Caption Text 1</div>
        </div>
        <div class="slide">
            <img src="img/th2.jpeg" alt="">
            <div class="caption">Caption Text 2</div>
        </div>
        <div class="slide">
            <img src="img/th3.jpeg" alt="">
            <div class="caption">Caption Text 3</div>
        </div>
        
        <div class="slide">
            <img src="img/th5.jpeg" alt="">
            <div class="caption">Caption Text 5</div>
        </div>
        <div class="slide">
            <img src="img/th6.jpeg" alt="">
            <div class="caption">Caption Text 6</div>
        </div>

        <span class="arrow prev" onclick="controller(-1)">&#10094</span>
        <span class="arrow next" onclick="controller(1)">&#10095</span>
    </div>
    <script src="script.js"></script>
</body>
</html>
